; OrrePort's UI layout for 16:10 screens (port/ui/layout/16x10.ini; read by port/src/pc_layout.c).
;
; Every row here is an OVERRIDE of the 4:3 base. The game's own 4:3 layout is the base and the reference: a piece with
; no row keeps its 4:3 place, in the 4:3 area centred on the wide screen. So this file can be empty and 16:10 still
; works; rows are added piece by piece where the wide screen should differ. 4:3 has no file. Studio's UI Editor will
; write these files (it shows each piece at 4:3 beside the chosen ratio); a mod may replace sections for one ratio.
; 16:10 is narrower than 16:9 (the visible picture covers logical x -64 .. 704 instead of -106.7 .. 746.7), so a row
; copied from 16x9.ini may need a smaller offset.
;
; The format (docs/port/widescreen-plan.md section 6, "The table and its loader"):
;   ; a comment, on its own line (';' or '#')
;   [window.0013]                one section per piece; the id is the piece's stable id, as the 2D inventory
;                                (ORRE_UI_INVENTORY=1, tools/local/ui_inventory.py) lists it: window.<menu id>,
;                                menu.<menu id>.item.<item id>, code.<name>, effect.<file>.<entry>, art.<name>
;   anchor = right               left | centre | right | stretch | keep43   (no row: centre, the 4:3 place)
;   offset = -12, 0              x, y in logical 640 x 480 pixels, added after the anchor
;   span = full                  full-screen effects only: 43 | full
;   border = black               kept 4:3 panels only: a colour name, #rrggbb, or none
;   note = why this row exists   free text for the UI Editor; never shown to the player (so no translation key)
; Ids hold letters, digits, '.', '_' and '-'. A value runs to the end of its line. A section that appears twice: the
; later one replaces the earlier one whole.
;
; Status (2026-11-19): no rows yet. Nothing reads the table at draw time yet either (the offset hooks are the plan's
; build order step 5), so this file changes nothing on screen today.
