     scratch script (globe_line.py): the ring as two 96-point circles (evenodd), each meridian arc a 6.5-unit band
     between two arcs of one circle through both poles. White; hub.rcss tints it like the link's text (dark and
     light). The earlier versions (a simple globe, then Eurasia) are in the history. -->
