# Pose rows: people put back the way a story scene left them, after a Continue from a saved spot (2026-11-21, snatcherLeo:
# "yes, put Vander back on the floor"). Read once by port/src/pc_pose_rows.cpp; how it works:
# docs/port/pc-menu-anywhere.md, "Pose rows"; why: the project notes, section 3.
#
# Why a table: PC MENU and the autosave let the game continue from almost any spot. The GameCube only ever continues
# from a PC, so a room's setup script (the part that runs when the room is entered and places its people from the story
# flags) only handles the states a player can walk in with. A scene can leave a person in a pose the setup never builds
# (Vander lying on Mt. Battle's bridge after Dakim's attack): after a Continue from a spot saved right there, the person
# stands at their default place instead. Nothing breaks, but it looks wrong. Each [pose <id>] row puts that person
# back, right after the room's setup has run and before its main loop starts, with the same commands the room scripts
# themselves use.
#
# When a row applies, all of these must hold:
#   - the game was just continued from a saved spot (a PC MENU save's spot or an autosave's), into this room. Entering
#     a room any other way stays exactly as on the GameCube;
#   - every flag condition in "when" holds;
#   - OrrePort isn't in GameCube-accurate mode (PC MENU and the autosave are off there, so no such Continue exists).
#
# A [pose <id>] section (the id is stable: logs and a future editor name the row by it):
#   room     = the room id; 0x hex or decimal
#   when     = story flags that must all hold, "flag=value" separated by spaces (flag ids decimal, as in
#              docs/engine/flags.md and the [flag] log lines)
#   person   = "group index": the person as the room's scripts name them (the script's people commands take a group and
#              an index; ORRE_NPC_LOG=1 and the debug "talk GROUP INDEX" command show the same pair)
#   anim     = the animation number to play (as std051_characterSetAnimation takes it), or -1 to leave it
#   loop     = 1 to keep it looping (a lying or kneeling pose), 0 to play it once
#   position = "x y z": where the person is placed (the game's own placement, so the model and the talk checks move too)
#   facing   = degrees (0-359), set at once, or "keep" to leave the facing the setup gave
#   look     = the person's head (optional; "keep" when left out):
#                keep   = leave it as the room's setup left it. A person whose placement has the look-at bit turns its
#                         head to follow the player from room entry on;
#                off    = the head stays still, looking at nothing: the game's own std067_characterStopLookAt, what a
#                         scene uses before it leaves someone lying, kneeling or busy (Mt. Battle's func73 does it to
#                         Vander). Talking to the person can still turn the head, as on the GameCube (its talk type);
#                player = the head follows the player (std065_characterLookAtPlayer, what the look-at bit does)
#              (added 2026-11-21, snatcherLeo: Vander's "head follows me when I don't think it should")
#   checked  = how the row was verified (free text, for people)
#
# For story mods (snatcherLeo: this should work for modded story flags too): a mod that adds a scene leaving someone in a pose
# adds its own [pose <id>] row here, with its own flags in "when". Rows are independent; more than one may apply in one
# room (each person once). A row whose person isn't in the room does nothing (the log says so).

[pose mt_battle_vander_down]
# Mt. Battle's valley (D2_valley_1, room 76 = 0x4C) after Dakim knocks Vander down and the Dakim battle is won (2678
# set), before Vander is talked to (1073 clear). The scene (func73) leaves Vander lying at (0, 157.6, -1538) playing
# animation 7, looping, without turning him, his head still (func73 calls std067_characterStopLookAt on him first); the
# room's setup (func53) lays him down the same way only before the battle (2495 set, 2678 clear), so after the battle a
# reload had him standing at (0, 157.6, -1531), and the room's entry had his head following Wes.
room = 0x4C
when = 2678=1 1073=0
person = 111 9
anim = 7
loop = 1
position = 0 157.6 -1538
facing = keep
look = off
checked = not yet (2026-11-21, written from the decoded script; to check with the save-check sweep's P10 saves 0081 / 0082)
