# PC MENU saves made in the middle of a story scene (the softlock fix; 2026-11-20). Read once by
# port/src/pc_save_windows.cpp; how it works: docs/port/pc-menu-anywhere.md, "Saves made in the middle of a scene"; why:
# the project notes
#
# Why a table: PC MENU lets the player save anywhere, also between two parts of a story scene. Some scenes leave the
# room in a state only the scene itself builds (people placed, a script waiting for the player), and the room's own
# setup, which is all a Continue runs, can't rebuild it: the game then hangs after Continue. The GameCube never lets the
# player save there (saves happen only at a PC), so the room scripts were never written for it. Each [window] below is
# one such state, found and checked by a run: when a PC MENU save is made while it matches, the save is still made, but
# the story flags it lists are rolled back in what is written (a state the game itself was in a moment earlier, which
# the room's setup does handle), so Continue plays that part of the scene again. A short line says so before saving
# (ui/lang key game.save_window.notice).
#
# A [window <id>] section (the id is stable: logs and a future editor name the row by it):
#   room     = the room the player stands in when PC MENU opens (the field room, not the PC screen); 0x hex or decimal
#   when     = story flags that must all hold, "flag=value" separated by spaces (flag ids decimal, as in
#              docs/engine/flags.md and the [flag] log lines)
#   rollback = the flags written into the save instead, "flag=value" separated by spaces. Only these change, and only in
#              the written save: the game in memory goes on with its own values
#   spot     = keep: Continue still goes on from the PC MENU spot (the room's setup then places the player itself);
#              pc: the spot is dropped, so Continue goes on from the save's own return point (the last PC used)
#   checked  = how the row was verified (free text, for people)
# A row whose rollback would give back something the scene hands out (an item, a Pokémon) must roll that back too, or
# it would be handed out twice: check the bag and the party when adding a row.
#
# Numbers in the other sections: the game's screen pixels (640 x 480) and OrrePort's own message keys (stable ids).

[notice]
# OrrePort's message key for the line shown above the PC's save question (ui/lang game.save_window.notice)
key = 0xFFF00033

[watch]
# The hang watch (the safety net for windows not in this table): after a Continue from a PC MENU spot, a talk / touch
# script that holds the player this many seconds with nothing on screen to answer brings up the question below.
# 30, not 20 (2026-11-20, the save-check sweep): the longest silent hold the sweep found in the whole story is The
# Under's subway ride (room 0x3A, touch event 4), about 22.2 s with nothing to answer before it lets go by itself; a
# 20 s line would ask "seems stuck" in the middle of it. 30 s leaves room above that; Rui's real hang never ends.
seconds = 30
# the question's message key (ui/lang game.save_window.stuck_question) and its YES / NO box's place (above the message
# window, as the PC screen's Main Menu question)
key = 0xFFF00034
yes_no_x = 440
yes_no_y = 150

[window phenac_rui_sack]
# Phenac City's plaza after the Folly / Trudly battle: the sack's scene has ended (993 set) but Rui is not untied yet
# (996 clear). The room's setup has no branch for that state: it hides the sack and Folly / Trudly, and the woman's
# touch event then waits forever for her (a wandering person) to stand still. With 993 clear the setup takes its
# "scene before / right after the battle" branch, and the room's main loop plays the after-battle part again (the battle
# stays won: 995 set), then the sack can be untied as normal.
room = 0x3
when = 992=1 993=1 996=0
rollback = 993=0
spot = keep
checked = 2026-11-20: the playtest's stuck save continued with 993 cleared replays the after-battle scene, the sack is untied, Rui joins (996, 997, 2767 set); a PC MENU save in this window written with the fix continues the same way
