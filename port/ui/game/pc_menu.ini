# The game's PC screen (POKéMON Storage, Item Storage, Save, Exit) with OrrePort's rows added: read by
# port/src/pc_pc_screen.cpp each time a PC screen opens (2026-11-15; docs/port/pc-menu-anywhere.md, "Main Menu on
# the PC screen: as built"). Why a file: snatcherLeo, 2026-11-15, keep the rows "in a small data list (ids, words, icons) so
# OrreBank later is one more entry", and the place, size and picture of everything added kept as data for the future UI
# Editor. A missing or broken line falls back to the value built into the code (the log says which).
#
# Numbers are the game's screen pixels (640 x 480). Ids are stable: a mod or the UI Editor refers to them.

[list]
# the buttons: the first row's top-left, the step down and right per row (the game's own 55 and 10; the list starts 25 px
# higher than the game's 179 so five rows fit above the bottom bar, as in the approved mockup)
first_x = 42
first_y = 154
step_y = 55
step_x = 10
# a row's word from its button's top-left (the game's own 16, 7)
label_dx = 16
label_dy = 7
# the word's room for OrrePort's rows (the game's widest, Item Storage, has 198)
label_width = 200

[wheel]
# the icon wheel: its centre and radius (the game's own 544, 215 and 130) and where an OrrePort icon's picture sits
# from the wheel's place for it (its 150 x 170 box). Measured 2026-11-15 on the US wheel sheet: the game's rounded
# frames are 121 x 121 (blue rim), and Save's and Pokémon's sit 3 px right of their sprite's left; Main Menu's frame
# (120 x 120 at 15, 21 in its box) lines up with them at -12; -6 put its centre at Pokémon's height (290).
# Changed 2026-11-16 (snatcherLeo: "It's close, very close. Maybe we could raise it higher"): the four game frames measured
# when chosen in PC frame dumps (their light outline, not the parts sticking out): Pokémon's centre at y 290.5,
# Items' body 298, Save's 276, Exit's 276.5; their middle is 285.3, so -10 puts Main Menu's centre there (289 -> 285;
# its size unchanged)
centre_x = 544
centre_y = 215
radius = 130
picture_dx = -12
picture_dy = -10

[question]
# the YES / NO box's place (menuSubOpenYesNo's x, y); the question itself shows in the game's message window
yes_no_x = 440
yes_no_y = 150

[order]
# top to bottom. The game's rows: pokemon_storage, item_storage, save, exit (their meaning is fixed in the game's code).
# OrrePort's rows are named below; a row left out of this list isn't shown. OrreBank later: one more [row] and its name
# here (snatcherLeo may put it at the top).
rows = pokemon_storage, item_storage, save, main_menu, exit

[row main_menu]
# the choice number the game's list returns for it (the game's own are 0-3; OrrePort's go on from 4 in the order the
# [row] sections come)
choice = 4
# the button's word and the question (ui/lang keys, in the game's language)
word = game.pc_menu.main_menu
question = game.pc_menu.main_menu_question
# the wheel piece: the icon and the label drawn over it, both 600 x 680 (4x the 150 x 170 piece), drawn down to the
# game's size. {lang} is the game's language (en, de, fr, it, es); a language without its own label uses English
# (Japanese on purpose: the Japanese disc's own wheel words are English)
icon = game/pc_menu/main_menu_icon.png
label = traced/pc_menu/main_menu_label_{lang}.png
# OrrePort's ids for this row: menu items (button piece, word, wheel piece), its sprite and texture, its message keys
item_button = 0x7070
item_label = 0x7071
item_icon = 0x7072
sprite = 0x7070
texture = ORMM
key_word = 0xFFF00031
key_question = 0xFFF00032
