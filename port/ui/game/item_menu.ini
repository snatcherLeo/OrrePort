# The bag's item options: OrrePort's item data for the USE rule (step 3.7, 2026-11-20). Read once by
# port/src/pc_bag_tweaks.cpp; the rule and why: docs/port/tweaks-37-research.md, section 1i "No USE button" and
# Appendix A.
#
# Why a file: most of the rule comes from the item's own record on the disc (its field-use function): USE is dropped
# where that function can never do anything ("not now", "can't be used") and GIVE or TOSS stays; the Ein Files' reader
# function makes USE read READ; TMs and HMs (item kind 4) get TOSS. What the record can't say is listed here, so the
# rule stays data, not code: the later Item Editor writes this file, and a mod's items can be added the same way.
#
# Sections (item ids as the game numbers them, decimal or 0x hex, separated by spaces):
#   [check] items whose USE can never do anything and that have no GIVE or TOSS to keep: USE reads CHECK and shows the
#           item's description again (instead of the game's "can't be used now")
#   [read]  items besides the Ein Files whose USE shows a text: USE reads READ (the action stays the item's own)
#   [toss]  items besides TMs and HMs that get TOSS where their pocket has none

[check]
# the four key items no room script ever lets the player use (checked in every decoded room script, research 1i):
# the Small Tablet, the Data ROM, the Steel Teeth, the Powerup Part
items = 502 530 531 546

[read]
items =

[toss]
items =
